name: Windows desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check (${{ matrix.configuration }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore solution
        run: dotnet restore BBTools.sln

      - name: Build solution
        run: dotnet build BBTools.sln --configuration ${{ matrix.configuration }} --no-restore -m:1

      # BBTools.Checks is a console integration runner, not a dotnet test project.
      # It creates its own synthetic process; no installed game or private ELF is needed.
      - name: Run integration checks
        run: dotnet run --project tests/BBTools.Checks --configuration ${{ matrix.configuration }} --no-build --no-restore

      - name: Package self-contained Windows x64 app
        if: matrix.configuration == 'Release'
        run: ./scripts/release.ps1 -Configuration Release

      - name: Upload Windows release package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: BBTools-win-x64
          path: |
            artifacts/BBTools-v*-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
